# ==============================================================================
# SUBSTRATE CONFIGURATION MANIFEST (Dalek Caan Ω Ecosystem)
# Role: Anchors the build environment against entropy and defines the recursive
#       state of the Dalek Caan Ω build-orchestrator.
# Connection: Orchestrated by SubstrateBuildOrchestrator.kt and integrated with
#             the SubstrateDependencyRegistry.
# ==============================================================================

# JVM Memory Allocation (Anchored to 4GB for high-fidelity compilation)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Parallel Execution (Decoupled project state)
org.gradle.parallel=true

# Kotlin Style (Official standard)
kotlin.code.style=official

# Resource Namespacing (Substrate isolation)
android.nonTransitiveRClass=true

# Build Caching (State persistence)
org.gradle.caching=true
org.gradle.configuration-cache=true

# Worker Constraints (Entropy mitigation)
org.gradle.workers.max=4

# Compiler Strategy (In-process execution for stability)
kotlin.compiler.execution.strategy=in-process

# Passthrough for missing manifestos
googleServices.missing.passthrough=true

# Dalek Caan Ω System Anchors
org.dalek.caan.omega.version=3.0
org.dalek.caan.omega.substrate.mode=STRICT_INTEGRITY